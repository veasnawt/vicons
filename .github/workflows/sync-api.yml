
name: Notify VIcons API

on:
  push:
    branches: [main]
    paths:
      - "assets/source/**/*.svg"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger VIcons API synchronization
        env:
          GH_TOKEN: ${{ secrets.VICONS_API_DISPATCH_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          gh api \
            --method POST \
            repos/veasnawt/vicons-api/dispatches \
            -f event_type=vicons-updated \
            -f client_payload[source_sha]="$SOURCE_SHA"
